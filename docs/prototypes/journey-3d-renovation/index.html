<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Home Renovation Journey</title>
<style>
/*
VOICE: calm, crafted, a little playful; the app is the picture
IDEA: a tabletop diorama of your own house that builds itself as the project moves
PICTURE: full-screen floating island with the house, trail, crew and paperwork in 3D
COLOUR and TYPE: sky that moves dawn to golden hour; Atlas violet #6b4bd1 accent; Roboto/system
LAYOUT: top header, 3D in the middle, time dial and item sheet at the bottom
*/
:root{color-scheme:light;--ink:#1d1830;--sub:#5d5672;--v:#6b4bd1;--v2:#efe9ff;--glass:rgba(255,255,255,.86);--line:rgba(40,20,90,.12)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe2ff}
body{font:15px/1.4 Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#sky{position:fixed;inset:0;background:linear-gradient(#9ec5ff,#e8f1ff 70%)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--v);outline-offset:2px}
.top{position:fixed;left:0;right:0;top:0;padding:12px 14px 26px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.top .back{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-size:22px}
.top h1{font-size:19px;margin:0;font-weight:600;line-height:1.15}
.top p{margin:1px 0 0;font-size:12.5px;color:var(--sub)}
.top .grow{flex:1}
.pill{height:38px;padding:0 14px;border-radius:19px;background:var(--glass);box-shadow:0 2px 10px rgba(30,10,80,.12);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill.on{background:var(--v);color:#fff}
.prog{position:fixed;top:0;left:0;height:3px;background:var(--v);z-index:6;transition:width .8s}
#preview{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#2b4a8a;color:#fff;font-size:12.5px;padding:6px 12px;border-radius:14px;z-index:5;display:none;gap:8px;align-items:center;white-space:nowrap}
#preview.show{display:flex}
#preview button{color:#cfe0ff;font-weight:700;text-decoration:underline}
#pins{position:fixed;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center}
.pin b{display:flex;align-items:center;gap:5px;background:var(--glass);padding:5px 10px 5px 6px;border-radius:14px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(30,10,80,.18);white-space:nowrap}
.pin i{width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:11px;background:#d9d4e6;color:#4c4560}
.pin.done i{background:#3d9a6b;color:#fff}
.pin.here i{background:var(--v);color:#fff;animation:pulse 1.6s infinite}
.pin.sel b{outline:2px solid var(--v)}
.pin.later b{opacity:.8}
.pin:after{content:"";width:2px;height:14px;background:rgba(255,255,255,.9)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(107,75,209,.6)}100%{box-shadow:0 0 0 9px rgba(107,75,209,0)}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bottom>*{pointer-events:auto}
.dial{background:var(--glass);border-radius:20px;padding:2px 18px 0;box-shadow:0 4px 18px rgba(30,10,80,.14);backdrop-filter:blur(8px)}
.dial .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:2px}
.track{position:relative;height:44px;touch-action:none}
.track .rail{position:absolute;left:0;right:0;top:23px;height:4px;border-radius:2px;background:#ddd6ee}
.track .fill{position:absolute;left:0;top:23px;height:4px;border-radius:2px;background:var(--v)}
.track .dot{position:absolute;top:18px;width:14px;height:14px;margin-left:-7px;border-radius:7px;background:#fff;border:2px solid #c5bbe0}
.track .dot.done{background:var(--v);border-color:var(--v)}
.track .today{position:absolute;top:0;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--v)}
.track .knob{position:absolute;top:10px;width:30px;height:30px;margin-left:-15px;border-radius:15px;background:#fff;box-shadow:0 2px 8px rgba(30,10,80,.35);display:grid;place-items:center}
.track .knob:after{content:"";width:10px;height:10px;border-radius:5px;background:var(--v)}
.sheet{background:#fff;border-radius:24px;padding:12px 14px 12px;box-shadow:0 -2px 22px rgba(30,10,80,.16)}
.kick{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--v)}
.sheet h2{margin:0;font-size:19px}
.ai{display:flex;gap:6px;font-size:13.5px;color:var(--sub);margin:2px 0 8px}
.ai:before{content:"✦";color:var(--v)}
.tiles{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:8px;background:#f5f2fb;border-radius:14px;padding:8px 12px 8px 8px;min-height:48px;max-width:220px;text-align:left}
.tile .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#fff;font-size:15px;flex:none}
.tile b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap}
.tile.alert small{color:#c0392b}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:22px;background:var(--v);color:#fff;font-weight:600}
.btn.ghost{background:var(--v2);color:var(--v)}
.confirm{font-size:13.5px;margin-top:10px;background:#fff6e6;border-radius:12px;padding:10px 12px}
#toast{position:fixed;left:50%;top:108px;transform:translateX(-50%) translateY(20px);opacity:0;background:#241c3b;color:#fff;border-radius:16px;padding:10px 14px;font-size:13.5px;display:flex;gap:14px;align-items:center;z-index:8;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:#c9b8ff;font-weight:700}
#viewer{position:fixed;inset:0;z-index:9;background:rgba(20,10,40,.35);display:none;align-items:flex-end}
#viewer.show{display:flex}
.vcard{background:#fff;width:100%;max-height:86%;overflow:auto;border-radius:26px 26px 0 0;padding:16px 18px 22px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.vhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vhead .grow{flex:1}
.vhead button{width:40px;height:40px;border-radius:20px;background:#f2eff8;font-size:18px}
.vcard h3{margin:0;font-size:19px}
.vcard .meta{font-size:12.5px;color:var(--sub)}
.facts{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:10px 0}
.facts .k{font-size:10.5px;font-weight:700;color:var(--v);margin:8px 0 2px}
.facts div.r{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.facts div.r:first-of-type{border-top:0}
.facts div.r span:last-child{font-weight:600;white-space:nowrap}
.doc{background:#faf9fd;border-radius:12px;padding:14px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#3a3450;white-space:pre-wrap}
.steps div{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.steps div:first-child{border-top:0}
.steps i{width:20px;height:20px;border-radius:6px;border:2px solid #bdb3d9;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;flex:none}
.steps .ok i{background:#3d9a6b;border-color:#3d9a6b}
.mood{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:90px 90px;gap:6px;margin:10px 0}
.mood div{border-radius:12px}
.ask{margin-top:12px;display:flex;gap:8px}
.ask input{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);padding:0 16px;font:inherit;font-size:16px;background:#f7f5fc}
#hint{position:fixed;top:92px;left:50%;transform:translateX(-50%);background:rgba(36,28,59,.82);color:#fff;font-size:12.5px;padding:7px 12px;border-radius:14px;z-index:5;transition:opacity .6s;white-space:nowrap}
#load{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#e8f1ff;font-weight:600;color:var(--v);transition:opacity .5s}
@media (prefers-reduced-motion:reduce){.pin.here i{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<div id="sky"></div>
<canvas id="c"></canvas>
<div class="prog" id="prog"></div>
<header class="top">
  <button class="back" aria-label="Back">←</button>
  <div class="grow"><h1>Home Renovation</h1><p id="sub">Trail · stop 2 of 5 · 20% of the way</p></div>
  <button class="pill" id="inside" aria-pressed="false">⌂ Look inside</button>
</header>
<div id="preview"><span id="prevtxt">Preview · not real yet</span><button id="backtoday">Back to today</button></div>
<div id="hint">Spin · pinch · tap anything · double-tap for the whole house</div>
<div id="pins"></div>
<div class="bottom">
  <div class="dial" aria-label="Time">
    
    <div class="track" id="track"><div class="rail"></div><div class="fill" id="fill"></div><div id="dots"></div><div class="today" id="todaylab">TODAY</div><div class="knob" id="knob" role="slider" tabindex="0" aria-label="Time"></div></div>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast"></div>
<div id="viewer"><div class="vcard" id="vcard"></div></div>
<div id="load">Building your house…</div>
<script type="module" src="./app.js"></script>
</body>
</html>
