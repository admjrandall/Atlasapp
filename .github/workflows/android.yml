# Builds and tests Atlas on every push; the debug APK is attached to each run.
# Action versions checked Nov 23 2026: checkout v7, setup-java v6, setup-gradle v6,
# setup-android v4, upload-artifact v7.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # Maven Central sometimes answers 429 (rate limited) on a cold cache; resolve dependencies with one retry first,
      # so a real test failure is never retried.
      - name: Resolve dependencies
        run: ./gradlew :app:dependencies --configuration debugUnitTestRuntimeClasspath > /dev/null || (sleep 60 && ./gradlew :app:dependencies --configuration debugUnitTestRuntimeClasspath > /dev/null)

      - name: Unit and UI tests (Robolectric)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: atlas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
